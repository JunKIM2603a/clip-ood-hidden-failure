experiment:
  name: mde_clip_ood_hidden_failure
  protocol_version: "2026-09-24-pre-score-feasibility-amendment"
  seed: 42

model:
  family: clip
  backbone: ViT-B/32

methods:
  - mcm
  - neglabel

implementation:
  validate_against_official_or_openood_vlm: true
  benchmark_family: imagenet_traditional_four

data:
  id:
    dataset: imagenet_1k
    split: ILSVRC2012_val
    expected_samples: 50000
    use_full_split: true

  primary_ood_sources:
    - name: inaturalist
      variant: mos_curated_10k
      expected_samples: 10000
      use_full_curated_split: true
    - name: sun
      variant: mos_curated_10k
      expected_samples: 10000
      use_full_curated_split: true
  secondary_ood_sources:
    - name: places
      variant: mos_curated_10k
      expected_samples: 10000
      use_full_curated_split: true
      predefined_subgroup_primary_eligible: false
      pre_score_mapping_coverage: 0.0178
      reason: "Failed frozen >=90% image-to-concept mapping coverage before detector scoring."

  aggregate_reproduction_only:
    - name: places
      variant: mos_curated_10k
      expected_samples: 10000
    - name: dtd
      variant: traditional_textures
      expected_samples: 5640

  additional_ood_subsampling: false
  deterministic_sampling: true

prompts:
  num_templates: 8
  target_range: [8, 16]
  semantic_equivalence_required: true
  freeze_before_final_analysis: true
  prohibit_primary_condition_modifiers:
    - dark
    - blurry
    - cropped
    - low_resolution
    - good
    - nice
  templates:
    - "a photo of a {label}."
    - "a photograph of a {label}."
    - "an image of a {label}."
    - "a picture of a {label}."
    - "this is a photo of a {label}."
    - "this is an image of a {label}."
    - "a photo depicting a {label}."
    - "an image depicting a {label}."

score_storage:
  save_per_prompt_scores: true
  save_sample_identifier: true
  save_source: true
  save_subgroup_assignments: true
  save_mean: true
  save_std: true
  save_lower_quantiles: true

subgroups:
  predefined:
    enabled: true
    config: configs/subgroups/predefined.yaml
    minimum_group_size_primary: 200
    minimum_leaf_concepts_primary: 2
    minimum_eligible_groups_per_source: 3
    minimum_mapping_coverage: 0.90
  text_embedding_cluster:
    enabled: true
    config: configs/subgroups/text_clustering.yaml
    embedding_model: sentence-transformers/all-MiniLM-L6-v2
    embedding_revision: 1110a243fdf4706b3f48f1d95db1a4f5529b4d41
    algorithm: kmeans_on_l2_normalized_embeddings
    num_clusters_rule: round_sqrt_num_leaf_concepts
    expected_num_clusters:
      inaturalist: 10
      sun: 7
      places: 7
  freeze_definition_before_final_analysis: true

metrics:
  aggregate:
    - auroc
    - aupr
    - fpr95
  subgroup:
    - auroc
    - fpr95
  worst_group:
    - max_fpr95
    - min_auroc
    - aggregate_to_worst_gap
  dispersion:
    enabled: true
  uncertainty:
    bootstrap: true
    confidence_level: 0.95
    num_resamples: 1000

prompt_sensitivity:
  status: frozen_before_h2_results
  freeze_date: "2026-09-25"
  primary_backbone: ViT-B/32
  prompt_count: 8
  prompt_variation: positive_id_class_prompt_template
  neglabel_negative_policy: freeze_h1_negative_prompt_embeddings_and_mining
  error_definition: h1_baseline_single_prompt_at_frozen_id95
  mean: true
  std: true
  std_ddof: 0
  lower_quantile: true
  lower_quantiles: [0.10, 0.25]
  required_error_models:
    m0:
      predictors:
        - prompt_score_mean
    m1:
      predictors:
        - prompt_score_mean
        - prompt_score_std
  primary_association:
    model: logistic_error_on_z_mu_and_z_sigma
    target_parameter: beta_sigma
    support_rule: bootstrap_95ci_lower_gt_0
  primary_predictive_comparison:
    validation: stratified_5fold_oof
    metric: log_loss
    improvement: logloss_m0_minus_logloss_m1
    support_rule: paired_bootstrap_95ci_lower_gt_0
  cv_folds: 5
  bootstrap_resamples: 1000
  minimum_errors_per_condition: 50
  minimum_correct_per_condition: 50
  minimum_supported_conditions: 3
  condition_support_requires:
    - positive_beta_sigma_ci
    - positive_oof_logloss_gain_ci
  decision_rule:
    pass: at_least_3_of_4_eligible_conditions_support_h2
    fail: fewer_than_3_of_4_eligible_conditions_support_h2
    insufficient: any_primary_condition_fails_error_count_eligibility
  required_controls_if_available:
    - ood_source
    - nearest_id_concept_similarity
    - score_margin
    - subgroup_size
  report:
    - error_rate_by_std_quantile
    - error_prediction_gain_m1_over_m0
    - subgroup_std_vs_fpr95
    - sigma_error_auroc
  h3_must_not_run_before_h2_decision: true

robust_aggregation:
  enabled: false
  run_after_h1_h2: true
  formula: mean_minus_lambda_std
  alternatives:
    - lower_quantile
  lambda_tuning:
    source: validation_only
    test_tuning_forbidden: true

decision_gate:
  require_mapping_audit: true
  minimum_primary_ood_sources_after_mapping_audit: 2
  actual_primary_ood_sources_after_mapping_audit:
    - inaturalist
    - sun
  require_bootstrap_for_go: true
  outcomes:
    - GO
    - CONDITIONAL_GO
    - KILL
